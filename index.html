<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Salida Slackline Club</title>
  <meta name="description" content="Salida Slackline Club meets every Thursday at 6:00pm at Thonhoff Park. All skill levels welcome." />
  <link rel="canonical" href="https://salidaslacklineclub.com/" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

  <meta property="og:title" content="Salida Slackline Club" />
  <meta property="og:description" content="Thursdays, 6:00pm at Thonhoff Park. All skill levels welcome." />
  <meta property="og:image" content="https://salidaslacklineclub.com/Images/hero-background-mobile.jpeg" />
  <meta property="og:type" content="website" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SportsClub",
    "name": "Salida Slackline Club",
    "sport": "Slacklining",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Salida",
      "addressRegion": "CO"
    },
    "location": {
      "@type": "Place",
      "name": "Thonhoff Park",
      "address": "Salida, CO"
    }
  }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">

  <style>

    :root {
      --slackline-red: #8A2C2C;            /* muted maroon — tweak freely */
      --text-light: #FFFFFF;               /* bottom info line */
      --display-font: 'Anton', sans-serif;   /*SLACKLINE — placeholder, swap later*/
      --western-font: 'roboto mono', serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: var(--western-font);
      overflow: visible;
    }

    /* full-screen stage */
    .stage {
      position: relative;
      height: 100vh;
      height: 100dvh;                      /* correct height on mobile browsers */
      width: 100%;
      overflow: hidden;
    }

    /* background photo (or video later) */
    .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;                   /* fills screen, crops as needed */
      object-position: center;             /* keeps sky on top, trees on bottom */
      z-index: 0;
    }

    /* content layer: title pinned top, info pinned bottom */
    .content {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 5vh 2vw;                    /* breathing room top/bottom + sides */
      text-align: center;
    }

    .title {
      width: 100%;
    }

    .title-img {
      display: block;
      width: clamp(240px, 80vw, 700px);
      max-width: 100%;
      margin: 0 auto;
    }

    .salida-img, .club-img {
      width: clamp(120px, 40vw, 220px);
    }

    .info {
      font-family: var(--western-font);
      font-weight: 400;
      color: var(--text-light);
      font-size: clamp(0.8rem, 2.2vw, 1.125rem);
      letter-spacing: 0.02em;
      background: rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      padding: 0.5em 1.2em;
      border-radius: 50px;
    }

    @media (max-width: 600px) {
      .bg {
        object-position: 35% center;
      }
      .content {
        padding-left: 0;
        padding-right: 0;
      }
      .title-img {
        width: clamp(200px, 78vw, 400px);
      }
      .salida-img, .club-img {
        width: clamp(100px, 38vw, 200px);
      }
      .info {
        font-size: clamp(1rem, 4vw, 1.125rem);
      }
    }

  </style>

  <style>
    /* ── TikTok feed ── */
    html {
      overflow-y: auto;
      scroll-snap-type: y mandatory;
    }

    .stage {
      scroll-snap-align: start;
    }

    .video-panel {
      position: relative;
      height: 100vh;
      height: 100dvh;
      width: 100%;
      overflow: hidden;
      scroll-snap-align: start;
    }

    /* groups the title pill + sound button, pinned bottom-center */
    .panel-bottom {
      position: absolute;
      bottom: 5vh;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .panel-footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3em;
      background: rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      padding: 0.6em 15px;
      border-radius: 16px;
      width: fit-content;
      max-width: calc(100vw - 68px);
      white-space: nowrap;
    }

    .video-panel .info {
      background: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      padding: 0;
      border-radius: 0;
    }

    @media (max-width: 600px) {
      .video-panel .bg {
        object-position: center;
      }
      /* smaller sound button on phones so the title pill keeps its room */
      .sound-btn { width: 44px; height: 44px; }
      .sound-btn svg { width: 18px; height: 18px; }
      .panel-footer { max-width: calc(100vw - 60px); }
    }

    .panel-title {
      font-family: 'Roboto Mono', monospace;
      font-weight: 700;
      color: #e06079;
      white-space: nowrap;
      text-align: center;
      padding: 0 8px;
    }

    /* subtle tap-to-play affordance — only shown while a clip's poster is up
       (e.g. iOS Low Power Mode blocks autoplay). Hidden whenever the clip plays. */
    .play-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      width: 72px;
      height: 72px;
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      cursor: pointer;
      display: none;                 /* shown via .is-paused on the panel */
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s ease;
      opacity: 0.85;
    }
    .play-btn::before {
      content: "";
      display: block;
      width: 0;
      height: 0;
      margin-left: 5px;              /* optically center the triangle */
      border-style: solid;
      border-width: 13px 0 13px 22px;
      border-color: transparent transparent transparent #fff;
    }
    .video-panel.is-paused .play-btn {
      display: flex;
    }

    /* TikTok-style sound toggle, sitting next to the title pill on each clip.
       It only exists on the video panels, so it's absent on the hero (page 1)
       and appears once you scroll to the first clip. Videos autoplay muted
       (browser rule); tapping this is the user gesture that unlocks sound. */
    .sound-btn {
      flex: 0 0 auto;
      width: 52px;
      height: 52px;
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .sound-btn svg { width: 22px; height: 22px; display: block; }
    .sound-btn .icon-on { display: none; }
    .sound-btn.is-on .icon-on { display: block; }
    .sound-btn.is-on .icon-off { display: none; }
  </style>
</head>
<body>

  <!-- Site-wide background song. Starts when the unmute button is pressed and
       plays over the whole site (not tied to any video). Swap the file in
       /music/ to change the song. -->
  <audio id="feedmusic" loop preload="auto">
    <source src="/music/feed-music.mp3" type="audio/mpeg" />
  </audio>

  <div class="stage">

    <video id="bgvid" class="bg" autoplay muted loop playsinline webkit-playsinline poster="Images/posters/hero.jpg">
      <source src="https://videos.salidaslacklineclub.com/hero.mp4" type="video/mp4" />
    </video>
    <img id="bgimg" class="bg" src="Images/hero-background-mobile.jpeg" alt="Thonhoff Park, Salida" style="display:none" />

    <div class="content">

      <div class="title">
        <img src="Images/salida-title.png" alt="Salida" class="title-img salida-img" />
        <img src="Images/Title Image.png" alt="Slackline" class="title-img" />
        <img src="Images/club-title.png" alt="Club" class="title-img club-img" />
      </div>

      <div class="info">Thursdays, 6:00pm at Thonhoff Park</div>

    </div>

  </div>

  <script>
    var v = document.getElementById('bgvid');
    v.play().catch(function() {
      v.style.display = 'none';
      document.getElementById('bgimg').style.display = 'block';
    });
  </script>

  <script>
    (function () {
      // Size the title to fill the pill, reserving room to its right for the
      // sound button (52px) plus the 12px gap.
      function fitTitle(el) {
        el.style.fontSize = '100px';
        var hPad = 30;       // 15px padding each side of the pill
        var btnSpace = 64;   // sound button (52) + gap (12)
        // cap at the size the title fills on a 450px viewport
        var maxAvailable = 450 - 16 - btnSpace - hPad;
        // on narrow screens, fill the viewport minus 8px each side, the button, and padding
        var viewportAvailable = window.innerWidth - 16 - btnSpace - hPad;
        var available = Math.min(viewportAvailable, maxAvailable);
        el.style.fontSize = (100 * available / el.scrollWidth) + 'px';
      }

      window.addEventListener('resize', function () {
        document.querySelectorAll('.panel-title').forEach(function (t) { fitTitle(t); });
      });

      var panels = [];          // { panel, vid } in document order
      var unlocked = false;
      var soundBtns = [];       // one unmute button per clip, kept in sync
      var music = document.getElementById('feedmusic');
      var musicOn = false;      // is the site-wide song playing?

      function inView(panel) {
        var r = panel.getBoundingClientRect();
        var mid = window.innerHeight / 2;
        return r.top < mid && r.bottom > mid;
      }

      // Attempt playback; toggle the panel's tap-to-play button based on success.
      // Videos always play muted — sound comes from the site-wide song, not clips.
      function tryPlay(p) {
        var pr = p.vid.play();
        if (pr && pr.then) {
          pr.then(function () { p.panel.classList.remove('is-paused'); })
            .catch(function () { p.panel.classList.add('is-paused'); });
        }
      }

      // First user gesture (e.g. tapping a play button in iOS Low Power Mode)
      // unlocks every feed video so scroll-autoplay works for the rest too.
      function unlockAll() {
        if (unlocked) return;
        unlocked = true;
        panels.forEach(function (p) {
          var pr = p.vid.play();
          if (pr && pr.then) {
            pr.then(function () {
              if (!inView(p.panel)) { p.vid.pause(); p.vid.currentTime = 0; }
            }).catch(function () {});
          }
        });
      }

      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          var idx = +entry.target.dataset.idx;
          var p = panels[idx];
          if (!p) return;
          if (entry.isIntersecting) {
            tryPlay(p);
            // warm up the next clip so it's instant on snap
            var next = panels[idx + 1];
            if (next && next.vid.preload !== 'auto') {
              next.vid.preload = 'auto';
              next.vid.load();
            }
          } else {
            p.vid.pause();
            p.vid.currentTime = 0;
            p.panel.classList.remove('is-paused');
          }
        });
      }, { threshold: 0.6 });

      var SOUND_ICONS =
        '<svg class="icon-off" viewBox="0 0 24 24" aria-hidden="true">' +
          '<path fill="#fff" d="M3 9v6h4l5 5V4L7 9H3z"/>' +
          '<path d="M16 9l5 6M21 9l-5 6" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>' +
        '</svg>' +
        '<svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true">' +
          '<path fill="#fff" d="M3 9v6h4l5 5V4L7 9H3z"/>' +
          '<path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 6a8 8 0 0 1 0 12" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>' +
        '</svg>';

      // Keep every clip's button showing the same (global) music state.
      function syncSoundButtons() {
        soundBtns.forEach(function (b) {
          b.classList.toggle('is-on', musicOn);
          b.setAttribute('aria-label', musicOn ? 'Mute' : 'Unmute');
        });
      }

      // Toggle the site-wide song. The tap itself is the user gesture that lets
      // the audio start; it then plays over the whole site until pressed again.
      function toggleSound() {
        musicOn = !musicOn;
        if (musicOn) {
          var pr = music.play();
          if (pr && pr.then) {
            pr.catch(function () { musicOn = false; syncSoundButtons(); });
          }
        } else {
          music.pause();
        }
        syncSoundButtons();
      }

      // Build a sound button for one clip's footer.
      function makeSoundButton() {
        var b = document.createElement('button');
        b.className = 'sound-btn';
        b.setAttribute('aria-label', 'Unmute');
        b.innerHTML = SOUND_ICONS;
        b.classList.toggle('is-on', musicOn);
        b.addEventListener('click', toggleSound);
        soundBtns.push(b);
        return b;
      }

      fetch('/videos.json')
        .then(function (r) { return r.json(); })
        .then(function (clips) {
          clips.forEach(function (clip, i) {
            var panel = document.createElement('div');
            panel.className = 'video-panel';
            panel.dataset.idx = i;

            var vid = document.createElement('video');
            vid.className = 'bg';
            vid.muted = true;
            vid.loop = true;
            vid.setAttribute('playsinline', '');
            vid.setAttribute('webkit-playsinline', '');
            vid.setAttribute('preload', 'none');
            vid.poster = clip.poster;
            var src = document.createElement('source');
            src.src = clip.src;
            src.type = 'video/mp4';
            vid.appendChild(src);

            var p = { panel: panel, vid: vid };

            var btn = document.createElement('button');
            btn.className = 'play-btn';
            btn.setAttribute('aria-label', 'Play video');
            btn.addEventListener('click', function () {
              unlockAll();
              tryPlay(p);
            });

            var footer = document.createElement('div');
            footer.className = 'panel-footer';

            var title = document.createElement('div');
            title.className = 'panel-title';
            title.textContent = 'Salida Slackline Club';

            var info = document.createElement('div');
            info.className = 'info';
            info.textContent = 'Thursdays, 6:00pm at Thonhoff Park';

            footer.appendChild(title);
            footer.appendChild(info);

            // bottom bar: the title pill with the sound button beside it
            var bottom = document.createElement('div');
            bottom.className = 'panel-bottom';
            bottom.appendChild(footer);
            bottom.appendChild(makeSoundButton());

            panel.appendChild(vid);
            panel.appendChild(btn);
            panel.appendChild(bottom);
            document.body.appendChild(panel);
            fitTitle(title);
            panels.push(p);
            observer.observe(panel);
          });
        });
    })();
  </script>
</body>
</html>
