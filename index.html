<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Salida Slackline Club</title>
  <meta name="description" content="Salida Slackline Club meets every Thursday at 6:00pm at Thonhoff Park. All skill levels welcome." />
  <link rel="canonical" href="https://salidaslacklineclub.com/" />

  <meta property="og:title" content="Salida Slackline Club" />
  <meta property="og:description" content="Thursdays, 6:00pm at Thonhoff Park. All skill levels welcome." />
  <meta property="og:image" content="https://salidaslacklineclub.com/Images/hero-background-mobile.jpeg" />
  <meta property="og:type" content="website" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SportsClub",
    "name": "Salida Slackline Club",
    "sport": "Slacklining",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Salida",
      "addressRegion": "CO"
    },
    "location": {
      "@type": "Place",
      "name": "Thonhoff Park",
      "address": "Salida, CO"
    }
  }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Arvo:wght@400;700&display=swap" rel="stylesheet" />

  <style>

    :root {
      --slackline-red: #8A2C2C;            /* muted maroon — tweak freely */
      --text-dark: #000000;                /* Salida + Club */
      --text-light: #FFFFFF;               /* bottom info line */
      --display-font: 'Anton', sans-serif; /* SLACKLINE — placeholder, swap later */
      --western-font: 'Arvo', serif;       /* Salida + Club — placeholder, swap later */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: var(--western-font);
      overflow: hidden;                    /* no scroll */
    }

    /* full-screen stage */
    .stage {
      position: relative;
      height: 100vh;
      height: 100dvh;                      /* correct height on mobile browsers */
      width: 100%;
      overflow: hidden;
    }

    /* background photo (or video later) */
    .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;                   /* fills screen, crops as needed */
      object-position: center;             /* keeps sky on top, trees on bottom */
      z-index: 0;
    }

    /* content layer: title pinned top, info pinned bottom */
    .content {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 5vh 2vw;                    /* breathing room top/bottom + sides */
      text-align: center;
    }

    .title {
      width: 100%;
    }

    .salida {
      font-family: var(--western-font);
      font-weight: 700;
      color: var(--text-dark);
      font-size: clamp(1.4rem, 5vw, 4rem);
      line-height: 1;
    }

    .slackline {
      font-family: var(--display-font);
      color: var(--slackline-red);
      font-size: clamp(2.5rem, 14vw, 13rem);  /* spans full width — re-tune vw if font changes */
      line-height: 0.95;
      letter-spacing: 0.01em;
      text-transform: uppercase;
    }

    .club {
      font-family: var(--western-font);
      font-weight: 700;
      color: var(--text-dark);
      font-size: clamp(1.4rem, 5vw, 4rem);
      line-height: 1;
    }

    .info {
      font-family: var(--western-font);
      font-weight: 400;
      color: var(--text-light);
      font-size: clamp(0.8rem, 2.2vw, 1.125rem);
      letter-spacing: 0.02em;
      background: rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      padding: 0.5em 1.2em;
      border-radius: 50px;
    }

    @media (max-width: 600px) {
      .bg {
        object-position: 35% center;
      }
      .content {
        padding-left: 0;
        padding-right: 0;
      }
      .salida, .club {
        font-size: clamp(2rem, 10vw, 4rem);
      }
      .slackline {
        font-size: clamp(5.5rem, 20vw, 18rem);
      }
      .info {
        font-size: clamp(1rem, 4vw, 1.125rem);
      }
    }

  </style>
</head>
<body>

  <div class="stage">

    <video id="bgvid" class="bg" autoplay muted loop playsinline webkit-playsinline poster="Images/THonhoff park copy.jpg">
      <source src="Images/IMG_3368.mp4" type="video/mp4" />
    </video>
    <img id="bgimg" class="bg" src="Images/hero-background-mobile.jpeg" alt="Thonhoff Park, Salida" style="display:none" />

    <div class="content">

      <div class="title">
        <div class="salida">Salida</div>
        <h1 class="slackline">Slackline</h1>
        <div class="club">Club</div>
      </div>

      <div class="info">Thursdays, 6:00pm at Thonhoff Park</div>

    </div>

  </div>

  <script>
    var v = document.getElementById('bgvid');
    v.play().catch(function() {
      v.style.display = 'none';
      document.getElementById('bgimg').style.display = 'block';
    });
  </script>
</body>
</html>
