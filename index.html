<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">

  <style>

    :root {
      --slackline-red: #8A2C2C;            /* muted maroon — tweak freely */
      --text-dark: #000000;                /* Salida + Club */
      --text-light: #FFFFFF;               /* bottom info line */
      --display-font: 'Anton', sans-serif;   /*SLACKLINE — placeholder, swap later*/
      --western-font: 'roboto mono', serif;       /* Salida + Club — placeholder, swap later */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: var(--western-font);
      overflow: visible;
    }

    /* full-screen stage */
    .stage {
      position: relative;
      height: 100vh;
      height: 100dvh;                      /* correct height on mobile browsers */
      width: 100%;
      overflow: hidden;
    }

    /* background photo (or video later) */
    .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;                   /* fills screen, crops as needed */
      object-position: center;             /* keeps sky on top, trees on bottom */
      z-index: 0;
    }

    /* content layer: title pinned top, info pinned bottom */
    .content {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 5vh 2vw;                    /* breathing room top/bottom + sides */
      text-align: center;
    }

    .title {
      width: 100%;
    }

    .salida {
      font-family: var(--western-font);
      font-weight: 700;
      color: var(--text-dark);
      font-size: clamp(1.4rem, 5vw, 4rem);
      line-height: 1;
    }

    .title-img {
      display: block;
      width: clamp(240px, 80vw, 700px);
      max-width: 100%;
      margin: 0 auto;
    }

    .club {
      font-family: var(--western-font);
      font-weight: 700;
      color: var(--text-dark);
      font-size: clamp(1.4rem, 5vw, 4rem);
      line-height: 1;
    }

    .info {
      font-family: var(--western-font);
      font-weight: 400;
      color: var(--text-light);
      font-size: clamp(0.8rem, 2.2vw, 1.125rem);
      letter-spacing: 0.02em;
      background: rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      padding: 0.5em 1.2em;
      border-radius: 50px;
    }

    @media (max-width: 600px) {
      .bg {
        object-position: 35% center;
      }
      .content {
        padding-left: 0;
        padding-right: 0;
      }
      .salida, .club {
        font-size: clamp(2rem, 10vw, 4rem);
      }
      .title-img {
        width: clamp(200px, 78vw, 400px);
      }
      .info {
        font-size: clamp(1rem, 4vw, 1.125rem);
      }
    }

  </style>

  <style>
    /* ── TikTok feed ── */
    html {
      overflow-y: auto;
      scroll-snap-type: y mandatory;
    }

    .stage {
      scroll-snap-align: start;
    }

    .video-panel {
      position: relative;
      height: 100vh;
      height: 100dvh;
      width: 100%;
      overflow: hidden;
      scroll-snap-align: start;
    }

    .panel-footer {
      position: absolute;
      bottom: 5vh;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3em;
      background: rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      padding: 0.6em 15px;
      border-radius: 16px;
      width: fit-content;
      max-width: calc(100vw - 16px);
      white-space: nowrap;
    }

    .video-panel .info {
      background: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      padding: 0;
      border-radius: 0;
    }

    @media (max-width: 600px) {
      .video-panel .bg {
        object-position: center;
      }
    }

    .panel-title {
      font-family: 'Roboto Mono', monospace;
      font-weight: 700;
      color: #e06079;
      white-space: nowrap;
      text-align: center;
      padding: 0 8px;
    }

    /* subtle tap-to-play affordance — only shown while a clip's poster is up
       (e.g. iOS Low Power Mode blocks autoplay). Hidden whenever the clip plays. */
    .play-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      width: 72px;
      height: 72px;
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      cursor: pointer;
      display: none;                 /* shown via .is-paused on the panel */
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s ease;
      opacity: 0.85;
    }
    .play-btn::before {
      content: "";
      display: block;
      width: 0;
      height: 0;
      margin-left: 5px;              /* optically center the triangle */
      border-style: solid;
      border-width: 13px 0 13px 22px;
      border-color: transparent transparent transparent #fff;
    }
    .video-panel.is-paused .play-btn {
      display: flex;
    }
  </style>
</head>
<body>

  <div class="stage">

    <video id="bgvid" class="bg" autoplay muted loop playsinline webkit-playsinline poster="Images/posters/hero.jpg">
      <source src="https://videos.salidaslacklineclub.com/hero.mp4" type="video/mp4" />
    </video>
    <img id="bgimg" class="bg" src="Images/hero-background-mobile.jpeg" alt="Thonhoff Park, Salida" style="display:none" />

    <div class="content">

      <div class="title">
        <div class="salida">Salida</div>
        <img src="Images/Title Image.png" alt="Slackline" class="title-img" />
        <div class="club">Club</div>
      </div>

      <div class="info">Thursdays, 6:00pm at Thonhoff Park</div>

    </div>

  </div>

  <script>
    var v = document.getElementById('bgvid');
    v.play().catch(function() {
      v.style.display = 'none';
      document.getElementById('bgimg').style.display = 'block';
    });
  </script>

  <script>
    (function () {
      function fitTitle(el) {
        el.style.fontSize = '100px';
        var hPad = 30; // 15px padding each side
        // cap at the size the title fills on a 450px viewport
        var maxAvailable = 450 - 16 - hPad;
        // on narrow screens, fill the viewport minus 8px each side minus padding
        var viewportAvailable = window.innerWidth - 16 - hPad;
        var available = Math.min(viewportAvailable, maxAvailable);
        el.style.fontSize = (100 * available / el.scrollWidth) + 'px';
      }

      window.addEventListener('resize', function () {
        document.querySelectorAll('.panel-title').forEach(fitTitle);
      });

      var panels = [];          // { panel, vid } in document order
      var unlocked = false;

      function inView(panel) {
        var r = panel.getBoundingClientRect();
        var mid = window.innerHeight / 2;
        return r.top < mid && r.bottom > mid;
      }

      // Attempt playback; toggle the panel's tap-to-play button based on success.
      function tryPlay(p) {
        var pr = p.vid.play();
        if (pr && pr.then) {
          pr.then(function () { p.panel.classList.remove('is-paused'); })
            .catch(function () { p.panel.classList.add('is-paused'); });
        }
      }

      // First user gesture (e.g. tapping a play button in iOS Low Power Mode)
      // unlocks every feed video so scroll-autoplay works for the rest too.
      function unlockAll() {
        if (unlocked) return;
        unlocked = true;
        panels.forEach(function (p) {
          var pr = p.vid.play();
          if (pr && pr.then) {
            pr.then(function () {
              if (!inView(p.panel)) { p.vid.pause(); p.vid.currentTime = 0; }
            }).catch(function () {});
          }
        });
      }

      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          var idx = +entry.target.dataset.idx;
          var p = panels[idx];
          if (!p) return;
          if (entry.isIntersecting) {
            tryPlay(p);
            // warm up the next clip so it's instant on snap
            var next = panels[idx + 1];
            if (next && next.vid.preload !== 'auto') {
              next.vid.preload = 'auto';
              next.vid.load();
            }
          } else {
            p.vid.pause();
            p.vid.currentTime = 0;
            p.panel.classList.remove('is-paused');
          }
        });
      }, { threshold: 0.6 });

      fetch('/videos.json')
        .then(function (r) { return r.json(); })
        .then(function (clips) {
          clips.forEach(function (clip, i) {
            var panel = document.createElement('div');
            panel.className = 'video-panel';
            panel.dataset.idx = i;

            var vid = document.createElement('video');
            vid.className = 'bg';
            vid.muted = true;
            vid.loop = true;
            vid.setAttribute('playsinline', '');
            vid.setAttribute('webkit-playsinline', '');
            vid.setAttribute('preload', 'none');
            vid.poster = clip.poster;
            var src = document.createElement('source');
            src.src = clip.src;
            src.type = 'video/mp4';
            vid.appendChild(src);

            var p = { panel: panel, vid: vid };

            var btn = document.createElement('button');
            btn.className = 'play-btn';
            btn.setAttribute('aria-label', 'Play video');
            btn.addEventListener('click', function () {
              unlockAll();
              tryPlay(p);
            });

            var footer = document.createElement('div');
            footer.className = 'panel-footer';

            var title = document.createElement('div');
            title.className = 'panel-title';
            title.textContent = 'Salida Slackline Club';

            var info = document.createElement('div');
            info.className = 'info';
            info.textContent = 'Thursdays, 6:00pm at Thonhoff Park';

            footer.appendChild(title);
            footer.appendChild(info);
            panel.appendChild(vid);
            panel.appendChild(btn);
            panel.appendChild(footer);
            document.body.appendChild(panel);
            fitTitle(title);
            panels.push(p);
            observer.observe(panel);
          });
        });
    })();
  </script>
</body>
</html>
